<input type="file" id="photoInput" accept="image/*">
<button onclick="uploadFile()">사진 올리기</button>

<script>
async function uploadFile() {
  const fileInput = document.getElementById('photoInput');
  if (fileInput.files.length === 0) return alert("사진을 선택해주세요!");

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = async function(e) {
    const base64 = e.target.result.split(',')[1];
    const payload = {
      base64: base64,
      contentType: file.type,
      fileName: `wedding_${Date.now()}_${file.name}`
    };

    // GAS 배포 후 받은 웹 앱 URL을 넣으세요
    const G_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPWu6BlTB6_aCeXli67Mn6XS5iM4h2Hsi37wPZOPxiKZqCYzqokGTHTdNlRiTT38zL7A/exec";

    try {
      const response = await fetch(G_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (result.result === "success") alert("사진이 성공적으로 전달되었습니다!");
    } catch (err) {
      console.error(err);
      alert("업로드 실패");
    }
  };
  reader.readAsDataURL(file);
}
</script>
