<div class="upload-section" style="text-align:center; padding:20px; border-top:1px solid #eee;">
    <h3 style="color:#2563eb;">📷 사진 선물하기</h3>
    <p style="font-size:0.9em; color:#666;">저희의 소중한 순간을 담은 사진을 보내주세요!</p>
    
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
    <label for="photoInput" style="display:inline-block; padding:10px 20px; background:#2563eb; color:white; border-radius:5px; cursor:pointer; margin-bottom:10px;">
        사진 선택하기
    </label>
    <div id="status" style="margin-top:10px; font-size:0.9em; color:#2563eb;"></div>
</div>

<script>
document.getElementById('photoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    // 파일 크기 제한 (구글 스크립트 전송 제한 약 50MB, 안전하게 10MB 권장)
    if (file.size > 10 * 1024 * 1024) {
        alert("파일이 너무 큽니다. 10MB 이하의 사진을 선택해주세요.");
        return;
    }

    const status = document.getElementById('status');
    status.innerText = "전송 중입니다. 잠시만 기다려주세요...";
    status.style.color = "#2563eb";

    const reader = new FileReader();
    reader.onload = function(e) {
        const base64 = e.target.result.split(',')[1];
        const data = {
            base64: base64,
            contentType: file.type,
            filename: file.name
        };

        // 새로 배포한 /exec 주소를 여기에 넣으세요
        const scriptURL = "https://script.google.com/macros/s/AKfycbxpBIOnbKz304HhtJhTQKGqcyaecKjlNMJdp_g4A75E_NW2z0QXeWexW8yJaNGTpj9pYA/exec"
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) throw new Error('네트워크 응답 에러');
            return response.json();
        })
        .then(res => {
            if(res.result === 'success') {
                status.innerText = "❤️ 소중한 사진이 전달되었습니다!";
                status.style.color = "#2563eb";
            } else {
                // 서버에서 보낸 실제 에러 메시지 표시
                status.innerText = "❌ 서버 에러: " + (res.error || "알 수 없는 오류");
                status.style.color = "red";
            }
        })
        .catch(err => {
            console.error(err);
            status.innerText = "❌ 전송 실패: 연결 상태를 확인해주세요.";
            status.style.color = "red";
        });
    };
    reader.readAsDataURL(file);
});
</script>
