<div style="padding: 20px; border: 1px solid #eee; border-radius: 10px;">
  <input type="file" id="photoInput" accept="image/*" multiple style="margin-bottom: 10px;">
  <br>
  <button onclick="uploadFiles()" id="uploadBtn" style="padding: 10px 20px; background-color: #ffb6c1; border: none; border-radius: 5px; cursor: pointer;">
    사진 올리기
  </button>
  
  <div id="status" style="margin-top: 15px; font-weight: bold; color: #555;"></div>
  <div id="progressBar" style="width: 0%; height: 5px; background-color: #ffb6c1; margin-top: 5px; transition: width 0.3s;"></div>
</div>

<script>
async function uploadFiles() {
  const fileInput = document.getElementById('photoInput');
  const statusDiv = document.getElementById('status');
  const progressBar = document.getElementById('progressBar');
  const uploadBtn = document.getElementById('uploadBtn');

  const files = fileInput.files;
  if (files.length === 0) return alert("사진을 선택해주세요!");

  // 업로드 중 버튼 비활성화
  uploadBtn.disabled = true;
  uploadBtn.innerText = "업로드 중...";
  
  let successCount = 0;
  const totalFiles = files.length;

  // 상태 초기화
  statusDiv.innerText = `업로드 시작: 0 / ${totalFiles}`;
  progressBar.style.width = "0%";

  // 각 파일을 순차적으로 또는 병렬로 업로드
  // 여기서는 안정성을 위해 순차적(for...of)으로 처리하며 상태를 업데이트합니다.
  for (let i = 0; i < totalFiles; i++) {
    const file = files[i];
    
    try {
      await uploadSingleFile(file);
      successCount++;
      
      // 진행 상태 업데이트
      const percent = Math.round((successCount / totalFiles) * 100);
      statusDiv.innerText = `진행 중: ${successCount} / ${totalFiles} 완료`;
      progressBar.style.width = `${percent}%`;
      
    } catch (err) {
      console.error(`${file.name} 업로드 실패:`, err);
    }
  }

  // 최종 결과 보고
  if (successCount === totalFiles) {
    statusDiv.innerText = "✅ 모든 사진이 성공적으로 업로드되었습니다!";
    alert("모든 사진 전송 완료!");
  } else {
    statusDiv.innerText = `⚠️ 일부 업로드 실패 (${successCount} / ${totalFiles} 성공)`;
    alert("업로드 과정 중 일부 오류가 발생했습니다.");
  }

  // 버튼 복구
  uploadBtn.disabled = false;
  uploadBtn.innerText = "사진 올리기";
  fileInput.value = ""; // 파일 선택 초기화
}

// 개별 파일 업로드를 처리하는 함수
function uploadSingleFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64 = e.target.result.split(',')[1];
      const payload = {
        base64: base64,
        contentType: file.type,
        fileName: `wedding_${Date.now()}_${file.name}`
      };

      const G_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPWu6BlTB6_aCeXli67Mn6XS5iM4h2Hsi37wPZOPxiKZqCYzqokGTHTdNlRiTT38zL7A/exec";

      try {
        const response = await fetch(G_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.result === "success") {
          resolve(result);
        } else {
          reject(result.message);
        }
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = (error) => reject(error);
    reader.readAsDataURL(file);
  });
}
</script>
